name: Daily flight price check

on:
  schedule:
    - cron: '0 7 * * *'   # 09:00 Berlin (summer), 08:00 (winter)
  workflow_dispatch:       # allows manual test runs

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install fast-flights typing_extensions

      - name: Run price check
        id: check
        run: |
          set -o pipefail
          python price_check.py | tee run_output.txt
          echo "result=$(grep '^RESULT:' run_output.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Commit price history
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A price_log.csv state.json
          git commit -m "Price check $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Email alert (below 700 EUR)
        if: "contains(steps.check.outputs.result, 'RESULT: ALERT')"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Flug-Deal: Hongkong unter 700 EUR" \
            --body-file alert_body.md

      - name: Warning (checker broken 3 days)
        if: contains(steps.check.outputs.result, 'streak=3')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Warnung: Flight-Checker seit 3 Tagen defekt" \
            --body "Der taegliche Preischeck schlaegt seit 3 Tagen fehl. Bitte in einer Claude-Session pruefen lassen."
