name: Daily flight price check

on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 Berlin (summer) / 07:00 (winter)
    - cron: '0 12 * * *'  # 14:00 Berlin (summer) / 13:00 (winter)
    - cron: '0 18 * * *'  # 20:00 Berlin (summer) / 19:00 (winter)
  workflow_dispatch:       # allows manual test runs

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install fast-flights typing_extensions

      - name: Run price check
        id: check
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
        run: |
          set +e
          python price_check.py > run_output.txt 2>&1
          echo "exit=$?" >> run_output.txt
          cat run_output.txt
          echo "result=$(grep '^RESULT:' run_output.txt | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Commit price history
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A price_log.csv state.json
          git add -f run_output.txt
          git commit -m "Price check $(date -u +%F)" || echo "nothing to commit"
          git push

      - name: Email alert (below 650 EUR)
        if: "contains(steps.check.outputs.result, 'RESULT: ALERT')"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.check.outputs.result }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --search "Flug-Deal in:title" --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "Alert issue already open - not creating a duplicate."
          else
            printf '@Ewuitz\n\n' | cat - alert_body.md > issue_body.md
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$(cat alert_title.txt)" \
              --assignee Ewuitz \
              --body-file issue_body.md
          fi

      - name: Warning (checker broken 3 days)
        if: contains(steps.check.outputs.result, 'streak=2')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Warnung: Flight-Checker seit 2 Tagen defekt" \
            --assignee Ewuitz \
            --body "@Ewuitz Der Preischeck schlaegt seit 2 Tagen fehl. Bitte in einer Claude-Session pruefen lassen."
