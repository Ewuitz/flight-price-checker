name: Debug API probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google Flights through Bright Data SERP zone
        env:
          BD: ${{ secrets.BRIGHTDATA_TOKEN }}
        run: |
          python3 - <<'PY' 2>&1 | tee probe_output.txt
          import json, os, re, urllib.request, urllib.parse, urllib.error
          tok = os.environ["BD"]
          def fetch(label, target, data_format="html"):
              payload = {"zone": "serp_api", "url": target, "format": "raw", "data_format": data_format}
              req = urllib.request.Request("https://api.brightdata.com/request",
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      body = r.read().decode(errors="replace")
                      print(label, "HTTP", r.status, "bytes", len(body))
                      return body
              except urllib.error.HTTPError as e:
                  msg = e.read().decode(errors="replace")[:200].replace(tok, "***")
                  print(label, "HTTPError", e.code, "".join(c for c in msg if c.isalnum() or c in ' _:,{}"-'))
              except Exception as e:
                  print(label, "FAIL", type(e).__name__, str(e)[:120])
              return None

          # sanity: plain google search
          b = fetch("sanity-search:", "https://www.google.com/search?q=pizza")

          # the real target: google flights round trip
          q = urllib.parse.quote("Flights from FRA to HKG on 2026-10-05 through 2026-12-03")
          url = "https://www.google.com/travel/flights?q=" + q + "&curr=EUR&hl=en&gl=de"
          h = fetch("flights:", url)
          if h:
              euros = re.findall(r"€\s?([\d.,]{3,7})", h)
              nums = []
              for e in euros:
                  d = re.sub(r"[^\d]", "", e)
                  if d and 100 <= int(d) <= 9999: nums.append(int(d))
              print("EUR-MATCHES", len(euros), "plausible-prices", len(nums), "min", min(nums) if nums else None, "sample", sorted(set(nums))[:12])
              # look for airline codes / stop wording
              print("has-nonstop", "nonstop" in h.lower(), "has-stop", " stop" in h.lower())
              # is it a consent/blocked page?
              low = h.lower()
              for marker in ("before you continue", "consent.google", "unusual traffic", "enablejs", "captcha"):
                  if marker in low: print("MARKER:", marker)
          PY

      - name: Commit probe output
        run: |
          git config user.name "probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f probe_output.txt
          git commit -m "probe output" || echo "nothing to commit"
          git push
