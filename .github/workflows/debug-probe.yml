name: Debug API probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/debug-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tfs URL with fast-flights, fetch via Bright Data, parse
        env:
          BD: ${{ secrets.BRIGHTDATA_TOKEN }}
        run: |
          python3 - <<'PY' 2>&1 | tee probe_output.txt
          import json, os, re, urllib.request, urllib.error
          tok = os.environ["BD"]
          FURL = "https://www.google.com/travel/flights/search?tfs=GhwSCjIwMjYtMTAtMDUoAWoFEgNGUkFyBRIDSEtHGhwSCjIwMjYtMTItMDMoAWoFEgNIS0dyBRIDRlJBQAFIAXABggELCP___________wGYAQE&hl=en&curr=EUR&gl=de"
          def fetch(fmt):
              p = {"zone": "serp_api", "url": FURL, "format": "raw", "render": True}
              if fmt: p["data_format"] = fmt
              req = urllib.request.Request("https://api.brightdata.com/request", data=json.dumps(p).encode(),
                  headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"}, method="POST")
              with urllib.request.urlopen(req, timeout=200) as r:
                  return r.read().decode(errors="replace")
          md = fetch("markdown")
          print("MD bytes", len(md))
          lines = [l.strip() for l in md.split("\n")]
          idxs = [i for i, l in enumerate(lines) if "\u20ac" in l]
          print("MD euro-lines", len(idxs))
          shown = 0
          for i in idxs:
              if shown >= 12: break
              block = lines[max(0, i-4): i+3]
              block = [re.sub(r"[^\w\u20ac.,:%()\[\]/+-]", " ", b)[:110] for b in block if b]
              if block:
                  print("--- ctx", i, "|", " || ".join(block))
                  shown += 1
          PY
      - name: Commit probe output
        run: |
          git config user.name "probe-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f probe_output.txt
          git commit -m "probe output" || echo "nothing to commit"
          git push
