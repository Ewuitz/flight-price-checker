name: Debug API probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe one-way coverage both directions
        env:
          TP: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          from datetime import date, timedelta
          tok = os.environ["TP"]
          def q(origin, dest, dep_at):
              params = urllib.parse.urlencode({"origin":origin,"destination":dest,"departure_at":dep_at,
                  "currency":"eur","one_way":"true","limit":1000,"sorting":"price","market":"de","token":tok})
              try:
                  with urllib.request.urlopen("https://api.travelpayouts.com/aviasales/v3/prices_for_dates?" + params, timeout=30) as r:
                      return json.load(r).get("data", [])
              except Exception as e:
                  print("  err", origin, dest, dep_at, str(e)[:80]); return []
          out_window = [date(2026,10,3)+timedelta(days=i) for i in range(5)]
          back_window = [date(2026,11,28)+timedelta(days=i) for i in range(5)]
          for o, d, months, window, lab in [
              ("FRA","HKG",["2026-10"], out_window, "OUT-FRA"),
              ("DUS","HKG",["2026-10"], out_window, "OUT-DUS"),
              ("HKG","FRA",["2026-11","2026-12"], back_window, "BACK-FRA"),
              ("HKG","DUS",["2026-11","2026-12"], back_window, "BACK-DUS")]:
              offers = []
              for m in months: offers += q(o, d, m)
              hits = []
              for off in offers:
                  dd = off.get("departure_at","")[:10]
                  try: ddd = date.fromisoformat(dd)
                  except: continue
                  if ddd in window and off.get("transfers", 9) <= 1:
                      hits.append((dd, off.get("price"), off.get("airline"), off.get("transfers")))
              hits.sort(key=lambda h: h[1])
              print(lab, "| total offers month-mode:", len(offers), "| in-window max-1-stop:", len(hits), "| best3:", hits[:3])
          PY
