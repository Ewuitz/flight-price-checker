name: Debug API probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Run one real v3 query and dump result fields
        run: |
          pip install fast-flights typing_extensions
          python3 - <<'PY'
          import fast_flights as ff
          kwargs = dict(
              flights=[
                  ff.FlightQuery(date="2026-10-05", from_airport="FRA", to_airport="HKG", max_stops=1),
                  ff.FlightQuery(date="2026-12-03", from_airport="HKG", to_airport="FRA", max_stops=1),
              ],
              trip="round-trip",
              seat="economy",
          )
          try:
              q = ff.create_query(**kwargs, currency="EUR")
              print("CURRENCY-KW ok")
          except TypeError as e:
              print("CURRENCY-KW rejected:", str(e)[:120])
              q = ff.create_query(**kwargs)
          res = ff.get_flights(q)
          try: n = len(res)
          except TypeError: res = list(res); n = len(res)
          print("N-RESULTS", n)
          for it in list(res)[:4]:
              attrs = [a for a in dir(it) if not a.startswith("_")]
              print("ATTRS", attrs[:25])
              vals = {a: str(getattr(it, a, ""))[:36].replace("\n", " ") for a in attrs
                      if a in ("price", "stops", "name", "airline", "is_best", "duration", "currency", "departure", "arrival")}
              print("ITEM", vals)
          PY
