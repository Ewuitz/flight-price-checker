name: Test notification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-notify.yml'
permissions:
  issues: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Create test alert issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "TEST 5: Flug-Deal Benachrichtigung" \
            --assignee Ewuitz \
            --body "@Ewuitz Fuenfter Test der Handy-Benachrichtigung. Kein echter Flugpreis."
